<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Beautiful Nothing — Stories by Oladimeji Ramon{% endblock %}</title>
  <meta name="description" content="Beautiful Nothing is a debut collection of short stories by Oladimeji Ramon, exploring the clash of faith and the blurred line between the physical and the spiritual.">
  <meta name="theme-color" content="#121212">
  {% block meta %}{% endblock %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23121212'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='34' text-anchor='middle' fill='%23efede6'%3EB%3C/text%3E%3Cpath d='M14 52 Q32 46 50 52' stroke='%23d7262f' stroke-width='3' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=Caveat:wght@400;500&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block head %}{% endblock %}
</head>
<body {% block body_attrs %}{% endblock %}>
  {% block body %}{% endblock %}
  <script src="/static/js/site.js" defer></script>
</body>
</html>
