{% extends "base.html" %}
{% from "_macros.html" import error %}
{% block title %}Admin sign in — Beautiful Nothing{% endblock %}
{% block head %}<meta name="robots" content="noindex">{% endblock %}
{% block body %}
<main class="page board page--center">
  <div class="wrap page__inner page__inner--narrow">
    <p class="kicker kicker--chalk">Beautiful Nothing</p>
    <h1 class="chalk-title">Admin</h1>
    <form class="sheet form" method="post" action="/admin/login">
      <input type="hidden" name="next" value="{{ next or '/admin' }}">
      <label class="field"><span>Password</span>
        <input name="password" type="password" required autocomplete="current-password" autofocus></label>
      {{ error(error_msg) }}
      <button class="btn btn--red btn--block" data-busy="Signing in…">Sign in</button>
    </form>
  </div>
</main>
{% endblock %}
