[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beautiful-nothing-python-worker"
version = "0.1.0"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2,<3",
    "httpx>=0.27",
    "email-validator>=2.1,<3",
    "python-dotenv>=1.0,<2"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk"
]

[tool.setuptools]
packages = []
py-modules = []
